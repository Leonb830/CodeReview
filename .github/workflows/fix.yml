name: Requested review fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: codereview-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/review fix') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require an immutable external engine revision
        env:
          ENGINE_REPOSITORY: ${{ vars.CODE_REVIEW_ENGINE_REPOSITORY }}
          ENGINE_REF: ${{ vars.CODE_REVIEW_ENGINE_REF }}
        run: |
          python - <<'PYCODE'
          import os, re
          repo, ref = os.environ["ENGINE_REPOSITORY"], os.environ["ENGINE_REF"]
          if repo or ref:
              assert re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo), "Set engine repository"
              assert re.fullmatch(r"[0-9a-f]{40}", ref), "Pin external engine to a full commit SHA"
          PYCODE
      # issue_comment runs the default-branch workflow, not code from the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.CODE_REVIEW_ENGINE_REPOSITORY || github.repository }}
          ref: ${{ vars.CODE_REVIEW_ENGINE_REF || github.sha }}
          token: ${{ secrets.CODE_REVIEW_ENGINE_TOKEN || secrets.GITHUB_TOKEN }}
          path: .review-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --project .review-engine --frozen --no-dev
      - name: Apply the authorized request in isolation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_COORDINATOR_KEY: ${{ secrets.OPENROUTER_COORDINATOR_KEY }}
          OPENROUTER_WORKER_KEY: ${{ secrets.OPENROUTER_WORKER_KEY }}
          # Optional installation token/PAT allows resulting PR events to trigger CI.
          CODE_REVIEW_APP_TOKEN: ${{ secrets.CODE_REVIEW_APP_TOKEN }}
        run: >-
          uv run --project .review-engine --frozen --no-dev codereview github-event
          --engine-root .review-engine --repo-root .review-target --output .review-output
      - name: Preserve repair and validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codereview-fix-${{ github.run_id }}
          path: .review-output/
          retention-days: 30
          if-no-files-found: ignore
