[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codereview-agent"
version = "0.2.0"
description = "Budgeted code review and requested fixes with OpenRouter, GitHub Actions, and a local CLI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "typer>=0.12,<1", "jsonschema>=4.23,<5"]

[project.scripts]
codereview = "codereview.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9", "mypy>=1.14", "pyyaml>=6", "types-jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/codereview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/codereview"]
